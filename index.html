<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineFlow · Cinema</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
/* Fallback autocontido: garante o layout mesmo se o CDN do Bootstrap estiver bloqueado */
:root{--bg:#0b0d12;--card:#161a23;--line:#2a3142;--red:#e50914;--gold:#f5c518;--txt:#f8f9fa;--mut:#9aa3b5;--av:#2e7d4f;--occ:#3a3f4b}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{margin:0 0 8px;line-height:1.2;color:var(--txt)}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem}
p{margin:0 0 8px}
code{background:#0f121a;padding:2px 6px;border-radius:6px}
.gold{color:var(--gold)}
.mut{color:var(--mut)}
.small{font-size:.85rem}
.sm{font-size:.95rem}
.bold{font-weight:700;margin:4px 0 12px}
.center{text-align:center}
.mt{margin-top:16px}
.full{width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 120px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;max-width:1200px;margin:0 auto}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header.top{position:sticky;top:0;z-index:50;background:#000;border-bottom:2px solid var(--red)}
.brand{font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--txt)}
.brand span{color:var(--gold)}
header nav{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
header nav a,header nav button.link{color:var(--txt);text-decoration:none;padding:6px 10px;border-radius:8px;opacity:.85;background:none;border:0;font:inherit;cursor:pointer}
header nav a:hover,header nav button.link:hover{opacity:1;background:#14171f}
header nav a.on{color:var(--gold);opacity:1}
.who{color:var(--gold);margin:0 6px;font-size:.9rem}
.badge-master{background:var(--red);color:#fff;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;margin:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kpi .v{font-size:1.9rem;font-weight:800;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.card.movie{padding:0}
.card.movie .body{padding:14px;display:flex;flex-direction:column;gap:6px}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.rating{border:1px solid var(--mut);border-radius:6px;padding:0 6px;font-size:.8rem;color:var(--mut);white-space:nowrap}
.chip{display:inline-block;margin:4px 4px 0 0;padding:6px 10px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;text-decoration:none;font-size:.85rem}
.chip:hover{background:var(--gold);color:#000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:#222;color:var(--txt);text-decoration:none;margin-top:6px}
.btn:hover{filter:brightness(1.1)}
.btn-red{background:var(--red);color:#fff}
.btn-gold{background:var(--gold);color:#000}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-del{background:#3b0d10;color:#ff8a8a}
.btn-sm{padding:6px 10px;font-size:.85rem}
.btn.dis{opacity:.4;pointer-events:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
input,select,textarea{background:#0f121a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;width:100%;color-scheme:dark}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
label.chk,label.radio{display:flex;align-items:center;gap:8px;color:var(--txt);font-size:1rem;margin:8px 0;cursor:pointer}
.field{margin-bottom:12px;flex:1 1 150px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;--bs-gutter-x:0;--bs-gutter-y:0;margin:0}
.row>*{width:auto;flex-shrink:1;max-width:none}
.two{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.two{grid-template-columns:2fr 1fr}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:.85rem}
td.r{text-align:right;white-space:nowrap}
td input{padding:6px 8px}
td input[type=checkbox]{width:auto}
.sumline{display:flex;justify-content:space-between;gap:10px;margin:6px 0}
.sumline.big{font-size:1.3rem;font-weight:800}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.screen{width:70%;height:12px;margin:0 auto 6px;background:linear-gradient(var(--gold),transparent);border-radius:50% 50% 0 0/100% 100% 0 0;box-shadow:0 -6px 28px rgba(245,197,24,.45)}
.screen-lbl{letter-spacing:.4em;font-size:.7rem;color:var(--mut);text-align:center;margin-bottom:14px}
.seatwrap{overflow-x:auto;padding-bottom:8px}
.seat-row{display:flex;justify-content:center;align-items:center;margin:2px auto;min-width:max-content}
.lbl{width:22px;text-align:center;color:var(--mut);font-size:.8rem;font-weight:700}
.aisle{width:18px;flex:0 0 18px}
.seat{width:30px;height:27px;margin:2px;border:0;border-radius:7px 7px 3px 3px;background:var(--av);color:#fff;font:600 .6rem system-ui;cursor:pointer;padding:0}
.seat:hover:not(:disabled){filter:brightness(1.25)}
.seat.sel{background:var(--gold);color:#000;font-weight:800}
.seat.occ{background:var(--occ);opacity:.5;cursor:not-allowed}
.legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:.85rem;color:var(--mut)}
.dot{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:middle}
.tag{display:inline-block;font-size:.75rem;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 6px;align-self:flex-start}
.ico{font-size:2.6rem;text-align:center;padding:8px 0}
.qty{display:flex;align-items:center;gap:8px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.ticket{background:linear-gradient(135deg,#1c212d,#0f121a);border:2px dashed var(--gold);border-radius:16px;padding:20px;max-width:560px;margin:0 auto}
.ticket.mini{padding:12px;margin:0 0 12px;max-width:none}
.code{display:inline-block;background:var(--gold);color:#000;font-weight:800;letter-spacing:.2em;padding:8px 18px;border-radius:8px;margin:10px 0}
.qr{width:120px;height:120px;margin:12px auto;border:6px solid #fff;border-radius:6px;background:repeating-linear-gradient(90deg,#000 0 6px,#fff 6px 12px),repeating-linear-gradient(0deg,#000 0 6px,transparent 6px 12px);background-blend-mode:multiply;opacity:.9}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:2px solid var(--red);padding:12px 16px;z-index:40}
.bottom .in{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.modal .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ord{background:#0f121a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:200;max-width:340px}
.toast{background:#1d2330;border-left:4px solid var(--gold);padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.danger{border-color:var(--red)}

/* Tela de login */
.login-wrap{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:420px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.brandmark{font-size:2.6rem;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0f121a;border:1px solid var(--line);border-radius:12px;padding:4px;margin:18px 0}
.seg button{background:transparent;color:var(--mut);border:0;border-radius:9px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--gold);color:#000}
.alert{padding:10px 12px;border-radius:10px;margin:0 0 12px;font-size:.9rem}
.alert-danger{background:#3b0d10;color:#ff9b9b;border:1px solid var(--red)}
.hint{font-size:.8rem;color:var(--mut);margin-top:12px;text-align:center}
.hint code{color:var(--gold)}

.seat-row+.seat-row{margin-top:2px}
@media(max-width:560px){
  .seat{width:23px;height:21px;font-size:.5rem;margin:1px}
  .lbl{width:16px}
  .aisle{width:8px;flex-basis:8px}
  h1{font-size:1.5rem}
}
</style>
</head>
<body>
<header class="top"><div id="hdr"></div></header>
<main id="app"></main>
<div id="modal"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ============ CONSTANTES E SEED ============ */
const KEY = 'cineflow_db_v2', CART_KEY = 'cineflow_cart', SESSION_KEY = 'cineflow_session';
const ROWS = 'ABCDEFGH'.split(''), COLS = 12;
const PAL = [['#0f2027','#2c5364'],['#3a1c71','#d76d77'],['#1a0000','#b0060f'],['#134e5e','#c99a06'],['#1d2330','#e50914']];

const SEED = {
  rooms: [
    { id: 'r1', name: 'Sala 1 IMAX', aisles: [4, 8] },
    { id: 'r2', name: 'Sala 2 3D', aisles: [4, 8] },
    { id: 'r3', name: 'Sala 3 Padrão', aisles: [6] }
  ],
  movies: [
    { id: 'm1', title: 'Horizonte Estelar', genre: 'Ficção Científica', duration: 142, rating: '12', synopsis: 'Uma tripulação atravessa um buraco de minhoca para salvar a Terra de um colapso climático irreversível.', colors: PAL[0], ativo: true },
    { id: 'm2', title: 'A Última Noite em Lisboa', genre: 'Drama', duration: 118, rating: '14', synopsis: 'Um fotógrafo aposentado revisita os lugares do seu primeiro amor em uma noite de chuva.', colors: PAL[1], ativo: true },
    { id: 'm3', title: 'Caçadores de Sombra', genre: 'Ação', duration: 128, rating: '16', synopsis: 'Uma agente disputa com uma organização secreta o controle de uma arma capaz de apagar cidades.', colors: PAL[2], ativo: true },
    { id: 'm4', title: 'Risos de Verão', genre: 'Comédia', duration: 96, rating: 'Livre', synopsis: 'Três amigos de infância se reencontram em uma cidade litorânea e um casamento vira um caos divertido.', colors: PAL[3], ativo: true }
  ],
  sessions: [
    { id: 's1', movieId: 'm1', roomId: 'r1', date: '2026-11-24', time: '14:00' },
    { id: 's2', movieId: 'm1', roomId: 'r1', date: '2026-11-24', time: '19:30' },
    { id: 's3', movieId: 'm2', roomId: 'r3', date: '2026-11-24', time: '16:15' },
    { id: 's4', movieId: 'm2', roomId: 'r2', date: '2026-11-25', time: '21:00' },
    { id: 's5', movieId: 'm3', roomId: 'r2', date: '2026-11-24', time: '17:45' },
    { id: 's6', movieId: 'm3', roomId: 'r1', date: '2026-11-25', time: '20:10' },
    { id: 's7', movieId: 'm4', roomId: 'r3', date: '2026-11-24', time: '13:00' },
    { id: 's8', movieId: 'm4', roomId: 'r3', date: '2026-11-25', time: '18:30' }
  ],
  products: [
    { id: 'p1', cat: 'Pipocas', name: 'Pipoca Pequena', desc: 'Balde individual, salgada ou doce.', price: 14.5, e: '🍿', active: true },
    { id: 'p2', cat: 'Pipocas', name: 'Pipoca Grande', desc: 'Balde family size, ideal para dividir.', price: 22, e: '🍿', active: true },
    { id: 'p3', cat: 'Pipocas', name: 'Pipoca Caramelo', desc: 'Coberta com calda de caramelo crocante.', price: 24.9, e: '🍯', active: true },
    { id: 'p4', cat: 'Bebidas', name: 'Refrigerante 500ml', desc: 'Cola, laranja ou limão, bem gelado.', price: 9, e: '🥤', active: true },
    { id: 'p5', cat: 'Bebidas', name: 'Água 500ml', desc: 'Água mineral sem gás.', price: 6, e: '💧', active: true },
    { id: 'p6', cat: 'Bebidas', name: 'Suco Natural', desc: 'Laranja ou maracujá, feito na hora.', price: 12, e: '🧃', active: true },
    { id: 'p7', cat: 'Combos', name: 'Combo Casal', desc: '2 pipocas grandes + 2 refrigerantes.', price: 49.9, e: '🎁', active: true },
    { id: 'p8', cat: 'Combos', name: 'Combo Solo', desc: '1 pipoca média + 1 refrigerante.', price: 32, e: '🎟️', active: true },
    { id: 'p9', cat: 'Doces', name: 'Chocolate ao Leite', desc: 'Barra de 90g.', price: 8, e: '🍫', active: true },
    { id: 'p10', cat: 'Doces', name: 'Mini Donut', desc: 'Açúcar e canela, porção com 4 unidades.', price: 11, e: '🍩', active: true }
  ],
  prices: { inteira: 30, meia: 15, autoMeia: true },
  occupied: { s1: ['A1', 'A2', 'B5', 'C7', 'C8', 'D12'], s3: ['G1', 'H12'], s5: ['E3', 'E4', 'F6', 'F7'] },
  orders: []
};

/* ============ UTILITÁRIOS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtDate = d => d ? d.split('-').reverse().slice(0, 2).join('/') : '';
const uid = p => p + Math.random().toString(36).slice(2, 8);

/* ============ PERSISTÊNCIA ============ */
// Inicialização automática: grava filmes e produtos padrão se o localStorage estiver vazio
function loadDB() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  const seed = JSON.parse(JSON.stringify(SEED));
  localStorage.setItem(KEY, JSON.stringify(seed));
  return seed;
}
let db = loadDB();

function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    return s && s.nome && (s.perfil === 'cliente' || s.perfil === 'master') ? s : null;
  } catch (e) { return null; }
}
let session = loadSession();
function startSession(nome, perfil) { session = { nome, perfil }; localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }
function endSession() { session = null; localStorage.removeItem(SESSION_KEY); }
const isMaster = () => !!session && session.perfil === 'master';

const ui = { cat: 'Todos', lastOrder: null, showOrders: false, mtab: 'dash', editMovie: null, ltab: 'cliente', loginErr: '', draft: { nome: '', email: '', user: '' } };

const emptyCart = () => ({ sessionId: null, seats: [], tipo: 'inteira', items: {} });
function getCart() { try { return { ...emptyCart(), ...JSON.parse(localStorage.getItem(CART_KEY)) }; } catch (e) { return emptyCart(); } }
function setCart(c) { localStorage.setItem(CART_KEY, JSON.stringify(c)); }

function commit() { localStorage.setItem(KEY, JSON.stringify(db)); render(); }

function sessionInfo(sid) {
  const session_ = db.sessions.find(s => s.id === sid);
  if (!session_) return null;
  return { session: session_, movie: db.movies.find(m => m.id === session_.movieId), room: db.rooms.find(r => r.id === session_.roomId) };
}

function totals(c) {
  const unit = c.tipo === 'meia' ? db.prices.meia : db.prices.inteira;
  const tickets = c.seats.length * unit;
  const items = Object.entries(c.items).reduce((s, [id, q]) => {
    const p = db.products.find(x => x.id === id);
    return s + (p && q > 0 ? p.price * q : 0);
  }, 0);
  const qty = Object.values(c.items).reduce((a, b) => a + b, 0);
  return { unit, tickets, items, total: tickets + items, count: c.seats.length + qty };
}

function poster(m) {
  const [c1, c2] = m.colors;
  const words = esc(m.title).split(' ').slice(0, 3);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="300" height="450" fill="url(#g)"/><circle cx="150" cy="150" r="70" fill="rgba(255,255,255,.08)"/><path d="M110 150l30 30 50-60" stroke="rgba(255,255,255,.35)" stroke-width="10" fill="none"/>${words.map((w, i) => `<text x="150" y="${290 + i * 40}" text-anchor="middle" font-family="Arial Black,Arial" font-size="32" fill="#fff">${w}</text>`).join('')}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function toast(msg, type = '') {
  const d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(() => d.remove(), 3200);
}

/* ============ ROTEAMENTO E CONTROLE DE ACESSO ============ */
const CLIENT_ROUTES = ['catalogo', 'sala', 'bomboniere', 'checkout'];

function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  return { name: h[0] || 'catalogo', arg: h[1] };
}

// Decide qual tela pode ser exibida conforme o perfil da sessão
function resolve(name) {
  if (!session) return 'login';
  if (isMaster()) return 'master';
  return CLIENT_ROUTES.includes(name) ? name : 'catalogo';
}

function render() {
  const r = route();
  const name = resolve(r.name);
  if (name !== r.name) { location.hash = '#/' + name; return; }
  if (name !== 'checkout') ui.lastOrder = null;

  const c = getCart(), t = totals(c);
  $('#hdr').innerHTML = header(name, t);

  let html;
  switch (name) {
    case 'login': html = vLogin(); break;
    case 'sala': html = vSala(r.arg); break;
    case 'bomboniere': html = vBomb(); break;
    case 'checkout': html = vCheckout(); break;
    case 'master': html = vMaster(); break;
    default: html = vCatalogo();
  }
  $('#app').innerHTML = html;
  $('#modal').innerHTML = ui.showOrders && session && !isMaster() ? ordersModal() : '';
}

function header(name, t) {
  const brand = `<a class="brand" href="#/${!session ? 'login' : isMaster() ? 'master' : 'catalogo'}">🎬 Cine<span>Flow</span></a>`;
  if (!session) {
    return `<div class="bar">${brand}<nav><a class="btn btn-sm btn-gold" href="#/login">Entrar</a></nav></div>`;
  }
  if (isMaster()) {
    return `<div class="bar">${brand}<nav>
      <a href="#/master" class="${name === 'master' ? 'on' : ''}">Painel Master</a>
      <span class="badge-master">Admin Master</span>
      <button class="btn btn-sm btn-ghost" data-act="logout">Sair</button></nav></div>`;
  }
  const links = [['catalogo', 'Filmes'], ['bomboniere', 'Bomboniere'], ['checkout', 'Checkout' + (t.count ? ` (${t.count})` : '')]];
  return `<div class="bar">${brand}<nav>
    ${links.map(([k, l]) => `<a href="#/${k}" class="${name === k ? 'on' : ''}">${l}</a>`).join('')}
    <button class="link" data-act="orders">🎟️ Meus Ingressos</button>
    <span class="who">👤 ${esc(session.nome)}</span>
    <button class="btn btn-sm btn-ghost" data-act="logout">Sair</button></nav></div>`;
}

/* ============ TELA DE LOGIN ============ */
function vLogin() {
  const d = ui.draft;
  const isCli = ui.ltab === 'cliente';
  const alert = ui.loginErr ? `<div class="alert alert-danger" role="alert">${esc(ui.loginErr)}</div>` : '';
  const form = isCli ? `
    <form data-form="login-cliente" novalidate>
      <div class="field"><label for="nome">Nome</label><input id="nome" name="nome" value="${esc(d.nome)}" placeholder="Como devemos chamar você?" autocomplete="name"></div>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" value="${esc(d.email)}" placeholder="voce@email.com" autocomplete="email"></div>
      <button class="btn btn-gold full" type="submit">Entrar como Cliente</button>
      <button class="btn btn-ghost full" type="button" data-act="demo">Entrar como Visitante / Demo</button>
    </form>` : `
    <form data-form="login-master" novalidate>
      <div class="field"><label for="user">Usuário</label><input id="user" name="user" value="${esc(d.user)}" autocomplete="username"></div>
      <div class="field"><label for="pass">Senha</label><input id="pass" name="pass" type="password" autocomplete="current-password"></div>
      <button class="btn btn-gold full" type="submit">Entrar como Master</button>
    </form>
    <p class="hint">Credenciais de teste: <code>admin</code> / <code>1234</code></p>`;
  return `<div class="login-wrap"><div class="card login-card">
    <div class="brandmark">🎬</div>
    <h2 class="center">Bem-vindo ao CineFlow</h2>

function vCatalogo() {

      const rm = db.rooms.find(r => r.id === s.roomId);

function vSala(sid) {
  const info = sessionInfo(sid);
  if (!info) return `<div class="wrap"><div class="card">Sessão não encontrada. <a href="#/catalogo">Voltar aos filmes</a></div></div>`;
  let c = getCart();
  if (c.sessionId !== sid) { c = { ...c, sessionId: sid, seats: [] }; setCart(c); }
  const occ = new Set(db.occupied[sid] || []);
  const { movie, room, session: sess } = info;

  let rows = '';
  ROWS.forEach(row => {
    let line = `<div class="seat-row"><span class="lbl">${row}</span>`;
    for (let n = 1; n <= COLS; n++) {
      if (room.aisles.includes(n - 1)) line += '<span class="aisle"></span>';
      const id = row + n, o = occ.has(id), s = c.seats.includes(id);
      line += `<button class="seat ${o ? 'occ' : s ? 'sel' : ''}" ${o ? 'disabled' : ''} data-act="seat" data-id="${id}" title="${id}${o ? ' (ocupado)' : ''}">${n}</button>`;
    }
    rows += line + `<span class="lbl">${row}</span></div>`;
  });

  const t = totals(c);
  const seatsTxt = c.seats.length ? [...c.seats].sort().join(', ') : 'Nenhum assento selecionado';
  return `<div class="wrap">
    <a href="#/catalogo" class="mut small">← Voltar aos filmes</a>
    <h1 class="mt">${esc(movie.title)}</h1>
    <p class="mut">${esc(room.name)} · ${fmtDate(sess.date)} às ${sess.time} · ${esc(movie.rating)}</p>
    <div class="two">
      <div class="card">
        <div class="seatwrap"><div class="screen"></div><div class="screen-lbl">TELA</div>${rows}</div>
        <div class="legend">
          <span><i class="dot" style="background:var(--av)"></i>Disponível</span>
          <span><i class="dot" style="background:var(--gold)"></i>Selecionado</span>
          <span><i class="dot" style="background:var(--occ);opacity:.6"></i>Ocupado</span>
        </div>
      </div>
      <div class="card">
        <h3>Tipo de ingresso</h3>
        <label class="radio"><input type="radio" name="tipo" ${c.tipo === 'inteira' ? 'checked' : ''} data-act="tipo" data-v="inteira"> Inteira · ${fmt(db.prices.inteira)}</label>
        <label class="radio"><input type="radio" name="tipo" ${c.tipo === 'meia' ? 'checked' : ''} data-act="tipo" data-v="meia"> Meia-Entrada · ${fmt(db.prices.meia)}</label>
        <hr>
        <div class="mut small">Assentos (${c.seats.length})</div>
        <div class="bold">${seatsTxt}</div>
        <div class="sumline"><span>Valor unitário</span><span>${fmt(t.unit)}</span></div>
        <div class="sumline big"><span>Subtotal</span><span class="gold">${fmt(t.tickets)}</span></div>

          <a class="btn btn-ghost" href="#/bomboniere">🍿 Adicionar bomboniere</a>
          <a class="btn btn-gold ${c.seats.length ? '' : 'dis'}" href="#/checkout">Ir para o checkout</a>
        </div>
      </div>
    </div></div>`;
}

  const info = c.sessionId ? sessionInfo(c.sessionId) : null;
  const ticketsBlock = c.seats.length && info ? `<h3>Ingressos</h3>
    <p><b>${esc(info.movie.title)}</b> · ${esc(info.room.name)}<br><span class="mut small">${fmtDate(info.session.date)} às ${info.session.time}</span></p>

/* ============ AÇÕES ============ */
function doLogin(nome, perfil) {
  startSession(nome, perfil);
  ui.loginErr = '';
  ui.draft = { nome: '', email: '', user: '' };
  toast(`Bem-vindo, ${nome}!`);
  location.hash = perfil === 'master' ? '#/master' : '#/catalogo';
  render();
}

function logout() {
  endSession();
  ui.lastOrder = null; ui.showOrders = false; ui.mtab = 'dash'; ui.editMovie = null; ui.loginErr = '';
  location.hash = '#/login';
  render();
  toast('Você saiu da sua conta.');
}

function finalize() {
  const c = getCart(), t = totals(c);
  if (!t.count) return;
  let info = null;
  if (c.seats.length) {
    info = sessionInfo(c.sessionId);
    if (!info) return toast('Sessão inválida. Escolha novamente.', 'danger');
    const taken = new Set(db.occupied[c.sessionId] || []);
    const conflict = c.seats.filter(s => taken.has(s));
    if (conflict.length) {
      c.seats = c.seats.filter(s => !taken.has(s));
      setCart(c);
      toast(`Os assentos ${conflict.join(', ')} acabaram de ser reservados. Escolha outros.`, 'danger');
      location.hash = '#/sala/' + c.sessionId;
      return;
    }
  }
  const seats = [...c.seats].sort();
  const order = {
    code: 'CF' + Date.now().toString(36).toUpperCase().slice(-4) + Math.random().toString(36).slice(2, 5).toUpperCase(),
    title: info ? info.movie.title : 'Bomboniere (avulso)',
    detail: info ? `${info.room.name} · ${fmtDate(info.session.date)} às ${info.session.time}` : 'Retirada no balcão',
    cliente: session.nome,
    seats, tipo: c.tipo, total: t.total,
    items: Object.entries(c.items).filter(([, q]) => q > 0).map(([id, q]) => ({ name: (db.products.find(p => p.id === id) || { name: 'Item removido' }).name, qty: q })),
    createdAt: new Date().toISOString()
  };
  if (info) db.occupied[c.sessionId] = [...(db.occupied[c.sessionId] || []), ...seats];
  db.orders.push(order);
  setCart(emptyCart());
  ui.lastOrder = order;
  commit();
  toast('Compra finalizada com sucesso!');
  location.hash = '#/checkout';
}

document.addEventListener('click', e => {
  if (e.target.id === 'ov') { ui.showOrders = false; render(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch (a) {
    case 'ltab': ui.ltab = v; ui.loginErr = ''; render(); break;
    case 'demo': doLogin('Visitante', 'cliente'); break;
    case 'logout': logout(); break;
    case 'orders': ui.showOrders = true; render(); break;
    case 'closeOrders': ui.showOrders = false; render(); break;
    case 'seat': {
      const c = getCart();
      if (c.seats.includes(id)) c.seats = c.seats.filter(s => s !== id);
      else if (c.seats.length >= 10) { toast('Limite de 10 assentos por compra.', 'danger'); return; }
      else c.seats.push(id);
      setCart(c); render(); break;
    }
    case 'tipo': { const c = getCart(); c.tipo = v; setCart(c); render(); break; }
    case 'clear': { const c = getCart(); c.seats = []; setCart(c); render(); break; }
    case 'qty': {
      const c = getCart();
      const n = Math.max(0, (c.items[id] || 0) + Number(el.dataset.d));
      if (n) c.items[id] = n; else delete c.items[id];
      setCart(c); render(); break;
    }
    case 'cat': ui.cat = v; render(); break;
    case 'finish': finalize(); break;
    case 'mtab': ui.mtab = v; ui.editMovie = null; render(); break;
    case 'newMovie': ui.editMovie = 'new'; ui.mtab = 'filmes'; render(); break;
    case 'editMovie': ui.editMovie = id; ui.mtab = 'filmes'; render(); break;
    case 'cancelEdit': ui.editMovie = null; render(); break;
    case 'delMovie': {
      if (!confirm('Remover este filme e todas as suas sessões?')) break;
      const sids = db.sessions.filter(s => s.movieId === id).map(s => s.id);
      db.movies = db.movies.filter(m => m.id !== id);
      db.sessions = db.sessions.filter(s => s.movieId !== id);
      sids.forEach(s => delete db.occupied[s]);
      ui.editMovie = null; commit(); toast('Filme removido.'); break;
    }
    case 'resetSess': delete db.occupied[id]; commit(); toast('Assentos liberados.'); break;
    case 'delSess': {
      if (!confirm('Remover esta sessão?')) break;
      db.sessions = db.sessions.filter(s => s.id !== id); delete db.occupied[id]; commit(); break;
    }
    case 'delProd': {
      if (!confirm('Remover este produto?')) break;
      db.products = db.products.filter(p => p.id !== id); commit(); break;
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]');
  if (!el) return;
  const k = el.dataset.chg, id = el.dataset.id;
  if (k === 'toggleMovie') { db.movies.find(m => m.id === id).ativo = el.checked; commit(); return; }
  const p = db.products.find(x => x.id === id);
  if (!p) return;
  if (k === 'pname') p.name = el.value.trim() || p.name;
  if (k === 'pprice') p.price = Math.max(0, Number(el.value) || 0);
  if (k === 'pactive') p.active = el.checked;
  commit(); toast('Produto atualizado.');
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  const g = n => (f.elements.namedItem(n)?.value ?? '');

  if (kind === 'login-cliente') {
    const nome = g('nome').trim(), email = g('email').trim();
    ui.draft = { ...ui.draft, nome, email };
    if (nome.length < 2) { ui.loginErr = 'Informe um nome com pelo menos 2 caracteres.'; return render(); }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { ui.loginErr = 'Informe um e-mail válido.'; return render(); }
    return doLogin(nome, 'cliente');
  }
  if (kind === 'login-master') {
    const user = g('user').trim(), pass = g('pass');
    ui.draft = { ...ui.draft, user };
    if (!user || !pass) { ui.loginErr = 'Preencha usuário e senha.'; return render(); }
    if (user === 'admin' && pass === '1234') return doLogin('Admin Master', 'master');
    ui.loginErr = 'Usuário ou senha incorretos. Verifique os dados e tente novamente.';
    return render();
  }
  if (kind === 'movie') {
    const data = {
      title: g('title').trim(), genre: g('genre').trim(), duration: Number(g('duration')) || 1,
      rating: g('rating').trim() || 'Livre', synopsis: g('synopsis').trim(), ativo: f.elements.namedItem('ativo').checked
    };
    const id = g('id');
    if (id) Object.assign(db.movies.find(m => m.id === id), data);
    else db.movies.push({ id: uid('m'), colors: PAL[db.movies.length % PAL.length], ...data });
    ui.editMovie = null; commit(); toast('Filme salvo.'); return;
  }
  if (kind === 'session') {
    db.sessions.push({ id: uid('s'), movieId: g('movie'), roomId: g('room'), date: g('date'), time: g('time') });
    commit(); toast('Sessão adicionada.'); return;
  }
  if (kind === 'prices') {
    const inteira = Math.max(0, Number(g('inteira')) || 0);
    const auto = f.elements.namedItem('auto').checked;
    db.prices = { inteira, autoMeia: auto, meia: auto ? Math.round(inteira * 50) / 100 : Math.max(0, Number(g('meia')) || 0) };
    commit(); toast('Preços atualizados.'); return;
  }
  if (kind === 'product') {
    db.products.push({ id: uid('p'), cat: g('cat').trim() || 'Outros', name: g('name').trim(), desc: g('desc').trim(), price: Math.max(0, Number(g('price')) || 0), e: g('e').trim() || '🍿', active: true });
    commit(); toast('Produto cadastrado.');
  }
});

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
